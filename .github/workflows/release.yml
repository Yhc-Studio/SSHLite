name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        shell: pwsh
        run: msbuild SSHLiteWin32.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Package
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}"
          $Stage = "dist\SSHLite-$Version-win-x64"
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          Copy-Item bin\Release\SSHLite.exe $Stage\
          Copy-Item bin\Release\SSHLiteAskPass.exe $Stage\
          Copy-Item README.md $Stage\
          Copy-Item LICENSE $Stage\
          Copy-Item RELEASE_NOTES.md $Stage\
          Compress-Archive -Path "$Stage\*" -DestinationPath "dist\SSHLite-$Version-win-x64.zip"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist\SSHLite-${{ github.ref_name }}-win-x64.zip" `
            --title "SSHLite ${{ github.ref_name }}" `
            --notes-file RELEASE_NOTES.md
